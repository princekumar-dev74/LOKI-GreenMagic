<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loki Pure Green Theme & Sleek Thunder</title>
  <style>
    * {
      box-sizing: border-box;
      cursor: none !important;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background: #020503;
    }

    /* Subtle Pure Green Flash Overlay */
    #thunder-flash {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.15) 0%, rgba(5, 46, 22, 0.05) 60%, transparent 85%);
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      mix-blend-mode: screen;
    }

    /* Dynamic Pure Green Pointer */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 8px;
      height: 8px;
      background: #00ffaa;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(1);
      box-shadow: 0 0 10px #00ffaa, 0 0 20px #042405;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.27), background-color 0.2s ease;
    }

    #cursor-trail-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9998;
    }

    #thunder-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 25;
    }

    .page {
      position: absolute;
      inset: 0;
      display: flex;
      min-height: 100vh;
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      z-index: 10;
      background: radial-gradient(circle at center, #06140b 0%, #010402 100%);
    }

    #home {
      will-change: transform, opacity, filter;
    }

    /* Center image with slightly refined green glow */
    #home-image {
      width: 550px;
      height: 550px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(0, 255, 136, 0.22)) drop-shadow(0 15px 35px rgba(0, 0, 0, 0.95));
      transition: filter 0.3s ease;
    }

    #shader-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 50;
      pointer-events: none;
    }

    .about-reveal {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #about-lift {
      display: flex;
      pointer-events: none;
    }

    #about-image {
      width: 260px;
      height: 260px;
      object-fit: contain;
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 0 16px rgba(0, 255, 136, 0.25)) drop-shadow(0 20px 50px rgba(0, 0, 0, 0.95));
      transform-origin: center center;
      will-change: transform;
    }
  </style>
</head>
<body>

  <div id="thunder-flash"></div>
  <canvas id="thunder-canvas"></canvas>

  <div id="custom-cursor"></div>
  <canvas id="cursor-trail-canvas"></canvas>

  <main id="home" class="page">
    <img src="home.png" alt="Home" id="home-image" />
  </main>

  <canvas id="shader-canvas"></canvas>

  <div id="about-reveal" class="about-reveal">
    <div id="about-lift">
      <img src="Loki.png" alt="About" id="about-image" />
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.178.0/build/three.module.js"
    }
  }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script type="module">
    import * as THREE from 'three'

    // 1. CURSOR & TRAIL SYSTEM (PURE GREEN SHADES)
    const cursorDot = document.getElementById('custom-cursor')
    const trailCanvas = document.getElementById('cursor-trail-canvas')
    const trailCtx = trailCanvas.getContext('2d')

    let mouseX = window.innerWidth / 2
    let mouseY = window.innerHeight / 2
    let pathHistory = []
    let isHovered = false
    let isMoving = false
    let stopTimer = null

    function resizeTrailCanvas() {
      trailCanvas.width = window.innerWidth
      trailCanvas.height = window.innerHeight
    }
    resizeTrailCanvas()
    window.addEventListener('resize', resizeTrailCanvas)

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX
      mouseY = e.clientY
      isMoving = true

      gsap.to(cursorDot, {
        x: mouseX,
        y: mouseY,
        duration: 0.05,
        ease: 'power2.out'
      })

      if (!isHovered) gsap.to(cursorDot, { scale: 1, duration: 0.15 })

      pathHistory.unshift({ x: mouseX, y: mouseY })
      if (pathHistory.length > 18) pathHistory.pop()

      clearTimeout(stopTimer)
      stopTimer = setTimeout(() => {
        isMoving = false
        if (!isHovered) gsap.to(cursorDot, { scale: 0.65, duration: 0.2 })
      }, 50)
    })

    function renderTrail() {
      trailCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height)
      if (!isMoving && pathHistory.length > 0) pathHistory.pop()

      if (pathHistory.length > 1) {
        trailCtx.save()
        trailCtx.lineCap = 'round'
        trailCtx.lineJoin = 'round'

        for (let i = 0; i < pathHistory.length - 1; i++) {
          const pt1 = pathHistory[i]
          const pt2 = pathHistory[i + 1]
          const ratio = 1 - (i / pathHistory.length)
          const lineWidth = ratio * 4.5

          trailCtx.beginPath()
          trailCtx.moveTo(pt1.x, pt1.y)
          trailCtx.lineTo(pt2.x, pt2.y)

          trailCtx.lineWidth = lineWidth
          const greenVal = Math.floor(200 * ratio + 55)
          trailCtx.strokeStyle = `rgba(0, ${greenVal}, 120, ${ratio * 0.85})`
          trailCtx.shadowBlur = ratio * 8
          trailCtx.shadowColor = '#00ffaa'
          trailCtx.stroke()
        }
        trailCtx.restore()
      }
      requestAnimationFrame(renderTrail)
    }
    renderTrail()

    const interactables = [document.getElementById('home-image'), document.getElementById('about-image')]
    interactables.forEach((el) => {
      el.addEventListener('mouseenter', () => {
        isHovered = true
        gsap.to(cursorDot, { scale: 1.5, backgroundColor: '#34d399', duration: 0.2 })
      })
      el.addEventListener('mouseleave', () => {
        isHovered = false
        gsap.to(cursorDot, { scale: 1, backgroundColor: '#00ffaa', duration: 0.2 })
      })
    })

    // 2. SLEEK & THIN PURE GREEN THUNDER (HIGH SPEED)
    const tCanvas = document.getElementById('thunder-canvas')
    const tCtx = tCanvas.getContext('2d')
    const thunderFlash = document.getElementById('thunder-flash')
    const homeImage = document.getElementById('home-image')
    let state = 'home'

    function resizeThunderCanvas() {
      tCanvas.width = window.innerWidth
      tCanvas.height = window.innerHeight
    }
    resizeThunderCanvas()
    window.addEventListener('resize', resizeThunderCanvas)

    function drawLightningSegment(x1, y1, x2, y2, displace, branchProb) {
      if (displace < 3) {
        tCtx.beginPath()
        tCtx.moveTo(x1, y1)
        tCtx.lineTo(x2, y2)
        tCtx.stroke()
        return
      }

      const midX = (x1 + x2) / 2 + (Math.random() - 0.5) * displace
      const midY = (y1 + y2) / 2 + (Math.random() - 0.5) * displace

      drawLightningSegment(x1, y1, midX, midY, displace / 2, branchProb)
      drawLightningSegment(midX, midY, x2, y2, displace / 2, branchProb)

      if (Math.random() < branchProb) {
        const angle = (Math.random() - 0.5) * Math.PI * 0.5
        const length = displace * (1.1 + Math.random())
        const branchX = midX + Math.cos(angle) * length
        const branchY = midY + Math.sin(angle) * length
        drawLightningSegment(midX, midY, branchX, branchY, displace / 2.2, branchProb * 0.45)
      }
    }

    function triggerGreenThunder() {
      if (state !== 'home') return

      gsap.to(thunderFlash, { opacity: 0.6, duration: 0.04, yoyo: true, repeat: 1, ease: 'power1.inOut' })

      gsap.to(homeImage, {
        x: () => (Math.random() - 0.5) * 5,
        y: () => (Math.random() - 0.5) * 5,
        duration: 0.03,
        repeat: 2,
        yoyo: true,
        onComplete: () => gsap.to(homeImage, { x: 0, y: 0, duration: 0.08 })
      })

      let frames = 0
      const startX = Math.random() * tCanvas.width
      const startY = 0
      const targetX = startX + (Math.random() - 0.5) * 450
      const targetY = tCanvas.height * (0.4 + Math.random() * 0.5)

      function animateLightning() {
        tCtx.clearRect(0, 0, tCanvas.width, tCanvas.height)

        tCtx.save()
        // Sleek Green Glow Outer Line (Thinner & Crisp)
        tCtx.strokeStyle = '#00ffaa'
        tCtx.shadowColor = '#00ffaa'
        tCtx.shadowBlur = 10
        tCtx.lineWidth = 2.4
        drawLightningSegment(startX, startY, targetX, targetY, 100, 0.4)

        // Bright Mint Green Core Line (No Blue)
        tCtx.strokeStyle = '#d1fae5'
        tCtx.lineWidth = 1.1
        tCtx.shadowBlur = 2
        drawLightningSegment(startX, startY, targetX, targetY, 100, 0.2)
        tCtx.restore()

        frames++
        if (frames < 4) {
          requestAnimationFrame(animateLightning)
        } else {
          tCtx.clearRect(0, 0, tCanvas.width, tCanvas.height)
        }
      }
      animateLightning()
    }

    // High Speed Trigger (Multiple strikes per second)
    function scheduleNextThunder() {
      const randomDelay = Math.random() * 600 + 200 

      setTimeout(() => {
        triggerGreenThunder()
        if (Math.random() > 0.5) {
          setTimeout(triggerGreenThunder, 90)
        }
        scheduleNextThunder()
      }, randomDelay)
    }
    scheduleNextThunder()

    // 3. SHADER TRANSITION (PURE GREEN PALETTE ONLY)
    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `

    const fragmentShader = `
      uniform float uProgress;
      uniform vec3 uColorA;
      uniform vec3 uColorB;
      uniform vec3 uColorC;
      varying vec2 vUv;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
          mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
          f.y
        );
      }

      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        for (int i = 0; i < 5; i++) {
          v += a * noise(p);
          p = p * 2.05 + vec2(13.7, 9.1);
          a *= 0.5;
        }
        return v;
      }

      void main() {
        vec2 uv = vUv;
        vec2 center = vec2(0.5);
        vec2 distVec = uv - center;
        float dist = length(distVec);

        float t = uProgress * 6.2831;

        float alpha = 0.0;
        vec3 color = vec3(0.0);

        if (uProgress <= 0.5) {
          float pNorm = uProgress / 0.5;
          vec2 p = uv * 3.5;
          vec2 warp = vec2(fbm(p + vec2(0.0, t * 0.25)), fbm(p + vec2(5.2, 1.3) - vec2(t * 0.2, 0.0)));
          float w = fbm(p + 1.1 * warp);

          float waves = sin(uv.x * 7.0 + t) * 0.035 + sin(uv.x * 14.0 - t) * 0.015;
          float wipe = uv.y + (w - 0.5) * 0.35 + waves;

          alpha = smoothstep(wipe - 0.1, wipe + 0.1, pNorm * 1.5 - 0.2);

          float tint = clamp((w - 0.5) * 0.5 + 0.5, 0.0, 1.0);
          color = mix(uColorA, uColorB, tint);
          color = mix(color, uColorC, sin(w * 6.28 + t) * 0.5 + 0.5);

          float glow = 1.0 - smoothstep(0.0, 0.2, abs(pNorm - wipe));
          color += glow * vec3(0.05, 0.85, 0.4);
        } else {
          float pNorm = (uProgress - 0.5) / 0.5;
          
          float angle = atan(distVec.y, distVec.x);
          vec2 fireUv = vec2(dist * 3.5 - t * 0.3, angle * 2.5);
          float fireNoise = fbm(fireUv + fbm(fireUv * 1.5));

          float fireRadius = pNorm * 2.2;
          float edge = fireRadius - (fireNoise * 0.28);
          
          float bloom = 1.0 - smoothstep(edge - 0.22, edge + 0.12, dist);
          float smoothFade = 1.0 - smoothstep(0.45, 1.0, pNorm);
          alpha = bloom * smoothFade;

          float innerGlow = smoothstep(edge - 0.45, edge, dist);
          color = mix(uColorA, uColorB, fireNoise + innerGlow * 0.6);
          color = mix(color, uColorC, innerGlow);

          float rim = smoothstep(0.0, 0.1, abs(dist - edge));
          color += (1.0 - rim) * vec3(0.1, 0.95, 0.5) * 1.8;
        }

        gl_FragColor = vec4(color, alpha);
      }
    `

    const canvas = document.getElementById('shader-canvas')
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true })
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
    renderer.setSize(window.innerWidth, window.innerHeight)

    const scene = new THREE.Scene()
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1)

    // Strictly Green Palettes: Deep Dark Forest Green, Bright Neon Green, Mint Emerald
    const uniforms = {
      uProgress: { value: 0 },
      uColorA: { value: new THREE.Color('#033d24') }, 
      uColorB: { value: new THREE.Color('#00ffaa') }, 
      uColorC: { value: new THREE.Color('#055e38') }, 
    }

    const material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      uniforms,
      transparent: true,
    })

    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material)
    scene.add(mesh)

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight)
    })

    const progress = { value: 0 }

    function animate() {
      uniforms.uProgress.value = progress.value
      renderer.render(scene, camera)
      requestAnimationFrame(animate)
    }
    requestAnimationFrame(animate)

    const homeElem = document.getElementById('home')
    const aboutLift = document.getElementById('about-lift')
    const aboutImage = document.getElementById('about-image')

    gsap.set(aboutLift, { y: 160 })
    gsap.set(aboutImage, { opacity: 0, scale: 1, x: 0, y: 0 })

    const parallaxX = gsap.quickTo(aboutImage, 'x', { duration: 0.8, ease: 'power2.out' })
    const parallaxY = gsap.quickTo(aboutImage, 'y', { duration: 0.8, ease: 'power2.out' })

    window.addEventListener('mousemove', (e) => {
      if (state !== 'covered') return
      const relX = e.clientX / window.innerWidth - 0.5
      const relY = e.clientY / window.innerHeight - 0.5
      parallaxX(relX * 80)
      parallaxY(relY * 80)
    })

    function coverScreen() {
      if (state !== 'home') return
      state = 'covering'

      gsap.to(progress, {
        value: 0.5,
        duration: 2.2,
        ease: 'power2.inOut',
        onComplete() {
          state = 'covered'
          revealImage()
        },
      })
    }

    function revealImage() {
      aboutImage.style.pointerEvents = 'auto'
      gsap.to(aboutLift, { y: 0, duration: 1.1, ease: 'power3.out' })
      gsap.to(aboutImage, { opacity: 1, duration: 1.1, ease: 'power3.out' })
    }

    function uncoverScreen() {
      if (state !== 'covered') return
      state = 'uncovering'
      aboutImage.style.pointerEvents = 'none'

      const tl = gsap.timeline()

      tl.to(aboutImage, {
        scale: 1.45,
        opacity: 0,
        duration: 1.2,
        ease: 'power2.in',
      })

      tl.to(progress, {
        value: 1.0,
        duration: 7.0,
        ease: 'power1.inOut',
        onComplete() {
          progress.value = 0
          gsap.set(aboutLift, { y: 160 })
          gsap.set(aboutImage, { opacity: 0, scale: 1, x: 0, y: 0 })
          state = 'home'
          window.dispatchEvent(new Event('transition:done'))
        },
      }, '-=1.0')

      tl.fromTo(homeElem, 
        { opacity: 0, scale: 0.95, filter: 'blur(8px)' },
        { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 3.5, ease: 'power2.out' },
        '-=2.8'
      )
    }

    homeImage.addEventListener('click', coverScreen)
    aboutImage.addEventListener('click', uncoverScreen)
  </script>
</body>
</html>
